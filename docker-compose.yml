# Kafka for local development: one broker in KRaft mode (no ZooKeeper) and Kafka UI to browse it; Seq for the logs.
# run-all.command starts these, and the rest of the application.
#
#   docker compose up -d      start, the API connects to localhost:9092
#   http://localhost:8081     Kafka UI: topics, messages, consumer groups and their lag
#   http://localhost:5341     Seq: the logs of the API
#   docker compose down       stop and remove the containers, the topics and their messages go with them
#
# See docs/kafka.md.
services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: photo-map-kafka
    ports:
      - "9092:9092"
    environment:
      # one node that is both the broker and the controller, the controller replaces ZooKeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # two listeners for clients: the API on the host reaches the broker as localhost:9092, the containers of this
      # file as kafka:29092. A client is told the advertised address of its listener and connects to that next.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # the internal topics default to 3 replicas, one broker can only hold one
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # a consumer joining a group gets its partitions right away instead of after 3 seconds
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topics created by a client writing to them, rather than by kafka-init, get 3 partitions too
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # creates the topics once the broker is up, then exits
  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic photo-saved --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic photo-processed --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic image-processing-requests --partitions 3 --replication-factor 1

  # the API logs to it (Serilog), at http://localhost:5341
  seq:
    image: datalust/seq:2024.3
    container_name: photo-map-seq
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      # local only: no login
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq-data:/data

  kafka-ui:
    image: kafbat/kafka-ui:v1.0.0
    container_name: photo-map-kafka-ui
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: photo-map
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # The API and the workers in containers, in the app profile: a plain docker compose up leaves them out, as
  # run-all.command runs them from the SDK instead.
  #
  #   docker compose --profile app up -d --build                       the API and one worker
  #   docker compose --profile app up -d --build --scale worker=3      three workers, at most one per partition
  #   http://localhost:5080/swagger                                    the API, over HTTP (PHOTO_MAP_API_PORT)
  #
  # Postgres is not in a container: the API connects to the one on the host (Postgres.app) through
  # host.docker.internal. The photos are kept on the host too, at PHOTO_STORAGE_PATH (~/Documents/Storage by
  # default), mounted into the API and the workers at that same path: the database keeps the full paths of the files,
  # which then stay the same, in and out of the containers.
  api:
    build:
      context: .
      dockerfile: PhotoMap.Api/PhotoMap.Api/Dockerfile
    image: photo-map-api
    container_name: photo-map-api
    profiles: [app]
    ports:
      - "${PHOTO_MAP_API_PORT:-5080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionString: ${PHOTO_MAP_CONNECTION_STRING:-Server=host.docker.internal;Port=5432;User Id=postgres;Password=postgres;Database=photo-map-db;Pooling=true;}
      FileStorage__BasePath: ${PHOTO_STORAGE_PATH:-${HOME}/Documents/Storage}
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:29092
      # the requests go to the worker containers below, through Kafka
      ImageProcessing__InProcess: "false"
      Seq__ServerUrl: http://seq:80
    volumes:
      - ${PHOTO_STORAGE_PATH:-${HOME}/Documents/Storage}:${PHOTO_STORAGE_PATH:-${HOME}/Documents/Storage}
      # the user secrets of the API (the Mapbox access token and the like), read in Development
      - ${HOME}/.microsoft/usersecrets:/home/app/.microsoft/usersecrets:ro

  worker:
    build:
      context: .
      dockerfile: PhotoMap.Worker.Host/Dockerfile
    image: photo-map-worker
    profiles: [app]
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      Kafka__BootstrapServers: kafka:29092
    volumes:
      # it reads the downloaded files, and leaves the thumbnails, at the paths the API gives
      - ${PHOTO_STORAGE_PATH:-${HOME}/Documents/Storage}:${PHOTO_STORAGE_PATH:-${HOME}/Documents/Storage}

volumes:
  seq-data:
